name: GitHub Profile Summary Cards

on:
  schedule:
    # Roda automaticamente todas as noites às 00:00
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Generate GitHub Cards

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Generate Visual Cards
    
        uses: actions/github-script@v6
        id: generate-cards
        continue-on-error: true

      - name: Profile Summary Cards Action
        
        uses: gauravghongde/github-profile-summary-cards@master
        with:
          username: ${{ github.repository_owner }}
          theme: tokyonight
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
